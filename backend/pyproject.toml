[project]
name = "dashd"
version = "0.0.1"
description = "Glass dash backend: reads truck CAN/OBD and GPS, streams signals to the browser UI"
requires-python = ">=3.11"
dependencies = [
  "python-can>=4.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyyaml>=6",
  "jsonschema>=4.18",  # checks vehicle profiles against vehicles/schema.json
  "anthropic>=2.14",  # voice assistant (only used when an API key is set)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Offline turn-by-turn navigation (just nav-setup). pyvalhalla wheels need Python 3.12+.
nav = ["pyvalhalla>=3.5", "osmium>=4"]
# Voice on the Pi through a USB speakerphone (pi/setup.sh --pi-voice): offline speech to text + text to speech.
voice = ["faster-whisper>=1.1", "piper-tts>=1.3"]

[project.scripts]
dashd = "dashd.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dashd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
